<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowForge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="topbar">

        <div class="logo">
            <span>⚡</span>
            FlowForge
        </div>

        <div class="actions">

            <button id="clearBtn" class="secondary-btn">
                Clear
            </button>

            <button id="runBtn" class="run-btn">
                ▶ Run Workflow
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>Nodes</h2>

            <p class="description">
                Add components to build your workflow.
            </p>


            <div class="node-library">

                <button class="library-node trigger"
                        data-type="trigger">

                    <span>⚡</span>

                    <div>
                        <strong>Trigger</strong>
                        <small>Start workflow</small>
                    </div>

                </button>


                <button class="library-node action"
                        data-type="action">

                    <span>⚙️</span>

                    <div>
                        <strong>Action</strong>
                        <small>Perform an action</small>
                    </div>

                </button>


                <button class="library-node condition"
                        data-type="condition">

                    <span>🔀</span>

                    <div>
                        <strong>Condition</strong>
                        <small>Check a rule</small>
                    </div>

                </button>


                <button class="library-node output"
                        data-type="output">

                    <span>📤</span>

                    <div>
                        <strong>Output</strong>
                        <small>Finish workflow</small>
                    </div>

                </button>

            </div>

        </aside>


        <!-- ================= WORKSPACE ================= -->

        <section class="workspace">

            <div class="workspace-header">

                <div>
                    <h1>Workflow Canvas</h1>

                    <p>
                        Connect your nodes and run the workflow.
                    </p>
                </div>

                <span id="nodeCount">
                    0 nodes
                </span>

            </div>


            <div id="canvas" class="canvas">

                <div id="emptyState" class="empty-state">

                    <div class="empty-icon">
                        ⚡
                    </div>

                    <h2>Build your workflow</h2>

                    <p>
                        Add a node from the sidebar to get started.
                    </p>

                </div>

            </div>

        </section>


        <!-- ================= LOG PANEL ================= -->

        <aside class="logs">

            <h2>Execution</h2>

            <div id="status" class="status idle">
                ● Ready
            </div>

            <div id="logsContainer" class="logs-container">

                <div class="log-placeholder">
                    Workflow execution logs will appear here.
                </div>

            </div>

        </aside>

    </main>


    <script src="script.js"></script>

</body>
</html>
